<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffdeeb 0%, #ffafcc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background hearts */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            animation: float 6s infinite linear;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 1;
            border: 3px solid #fff;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff477e;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        p {
            color: #6c5ce7;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .gif-container img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.5);
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-yes {
            background-color: #ff477e;
            color: white;
            z-index: 10;
        }

        .btn-yes:hover {
            background-color: #ff0054;
        }

        .btn-no {
            background-color: #ffb3c1;
            color: #590d22;
        }

        .btn-no:hover {
            background-color: #ff8fa3;
        }

        /* Fullscreen cover mode when Yes gets huge */
        .btn-yes.covering {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            z-index: 9999 !important;
            font-size: 3rem !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transform: none !important;
        }

        /* Second Window / Success Screen */
        #successCard {
            display: none;
        }

        #successCard h1 {
            color: #ff0054;
            font-size: 2.5rem;
        }

        #successCard p {
            color: #4a4e69;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <h1>Happy Birthday! 🎉</h1>
        <p>Will you be my girlfriend? 💖</p>
        
        <div class="gif-container">
            <img id="cuteImg" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Y2Z2x3Y3J3eWRmeWd3OHRjc3R5Y3R5Y3R5Y3R5Y3R5Y3R5JnB2PWNmJnRzPWdpZg/cLS1dnt82k81u/giphy.gif" alt="Cute Bear Hug">
        </div>

        <div class="button-group">
            <button class="btn btn-yes" id="yesBtn">Yes!</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <div class="card" id="successCard">
        <h1>Yay! I knew it! 🥰</h1>
        <div class="gif-container" style="margin-top: 15px;">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eXU2ZzZ4eXU2ZzZ4eXU2ZzZ4eXU2ZzZ4eXU2ZzZ4eXU2JnB2PWNmJnRzPWdpZg/26hpW3f2c25C2l5V6/giphy.gif" alt="Celebration GIF">
        </div>
        <p>Best decision ever! Happy Birthday again! ❤️✨</p>
    </div>

    <script>
        // Generate floating hearts
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
        }

        let scale = 1;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionCard = document.getElementById('questionCard');
        const successCard = document.getElementById('successCard');

        const noPhrases = [
            "Are you sure?",
            "Think again! 🥺",
            "Wrong answer! 😜",
            "Please? 💕",
            "You can't say no! ✨",
            "Just press Yes!"
        ];
        let phraseIndex = 0;

        noBtn.addEventListener('click', () => {
            scale *= 1.45; // Size multiplier for YES button
            
            if (scale > 6) {
                // Cover the whole screen if clicked too many times
                yesBtn.classList.add('covering');
                yesBtn.innerHTML = "YES! 💖 (Click Me!)";
            } else {
                yesBtn.style.transform = `scale(${scale})`;
                noBtn.innerText = noPhrases[phraseIndex % noPhrases.length];
                phraseIndex++;
            }
        });

        yesBtn.addEventListener('click', () => {
            questionCard.style.display = 'none';
            successCard.style.display = 'block';
        });
    </script>
</body>
</html>
